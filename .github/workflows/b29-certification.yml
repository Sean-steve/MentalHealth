name: Certify MindOS Phase B29

on:
  pull_request:
    branches: [main]
    paths:
      - 'mindos/**'
      - 'tests/**'
      - 'scripts/**'
      - 'server.ts'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/b29-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b29-certification-pr
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mindos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mindos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      MINDOS_ENV: test
      PORT: 3000
      APP_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DEFAULT_COUNTRY_CODE: KE
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindos_test
      MINDOS_DATABASE_DRIVER: postgres
      DB_POOL_MIN: 1
      DB_POOL_MAX: 8
      DB_SSL: "false"
      DB_TIMEOUT_MS: 5000
      REDIS_CACHE_URL: redis://localhost:6379/0
      REDIS_QUEUE_URL: redis://localhost:6379/1
      CACHE_ENABLED: "true"
      JWT_SECRET: b29-test-jwt-secret-minimum-32-characters
      SESSION_SECRET: b29-test-session-secret-minimum-32-characters
      AUDIT_INTEGRITY_SALT: b29-test-audit-integrity-salt
      ANALYTICS_PSEUDONYM_SALT: b29-test-analytics-pseudonym-salt
      DATA_LIFECYCLE_HASH_SALT: b29-test-lifecycle-hash-salt
      LAUNCH_PARTICIPANT_HASH_SALT: b29-test-launch-participant-salt
      SLOT_SIGNING_SECRET: b29-test-slot-signing-secret-32-chars
      ALLOW_INSECURE_COOKIES: "true"
      CSRF_ENABLED: "true"
      AI_PROVIDER: mock_sandbox
      GEMINI_API_KEY: TEST_ONLY_NOT_REAL
      PAYMENTS_PROVIDER: mock
      NOTIFICATIONS_PROVIDER: mock_console
      NOTIFICATIONS_REAL_DISPATCH: "false"
      ANALYTICS_ENABLED: "true"
      STRICT_RELEASE_GATES: "true"
      SAFETY_POLICY_VERSION: 2.0.0
      MINDOS_MESSAGE_ATTACHMENT_POLICY_JSON: '{"max_bytes":1048576,"allowed_mime_types":["application/pdf","image/jpeg","image/png"],"allowed_data_classifications":["HEALTH_SENSITIVE","CLINICAL_RECORD"]}'
      MINDOS_TASK_RECURRENCE_POLICIES_JSON: '[{"rule_key":"TEST_DAILY","interval_minutes":1440,"anchor":"PRIOR_DUE_AT","max_occurrences":3,"policy_version":"TEST-1"}]'

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate 27-migration registry
        run: bun run db:validate-migrations

      - name: Apply all canonical migrations to PostgreSQL 16
        run: bun run db:migrate

      - name: Typecheck full source
        run: bun run typecheck

      - name: Full Sprint 1-B29 regression
        env:
          # Historical canonical tests deliberately use isolated synthetic IDs
          # and the high-fidelity in-memory driver. Native PostgreSQL durability
          # is certified separately below by B29/DR/PostgreSQL smoke gates.
          MINDOS_DATABASE_DRIVER: canonical
        run: bun run test

      - name: B29 persistence acceptance
        env:
          MINDOS_DATABASE_DRIVER: canonical
        run: bun run test:b29

      - name: Release assurance regression
        run: bun run test:sprint27

      - name: Security red-team regression
        run: bun run test:sprint27:red-team

      - name: Clinical validation regression
        run: bun run test:sprint27:clinical

      - name: Privacy and Kenya regulatory regression
        run: bun run test:sprint27:privacy-regulatory

      - name: Accessibility baseline
        run: bun run sprint27:a11y

      - name: Secret scan
        run: bun run scan:secrets

      - name: Dependency vulnerability gate
        run: bun run scan:dependencies

      - name: Disaster recovery restore drill with migration 027
        run: bun run sprint26:dr-smoke

      - name: Sprint 27 PostgreSQL release-assurance smoke
        run: bun run sprint27:postgres-smoke

      - name: Sprint 28 PostgreSQL controlled-launch smoke
        run: bun run sprint28:postgres-smoke

      - name: B29 User → Professional → Operations PostgreSQL golden path
        run: bun run b29:local-certification

      - name: Production build
        run: bun run build

      - name: B29 performance budget
        run: bun run sprint27:performance

      - name: SBOM
        run: bun run build:sbom
