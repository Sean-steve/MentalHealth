name: Certify MindOS Sprint 22

on:
  push:
    branches: [main]
    paths:
      - 'mindos/**'
      - 'tests/**'
      - 'scripts/**'
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/sprint22-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint22-certification-main
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mindos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mindos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      MINDOS_ENV: test
      PORT: 3000
      APP_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DEFAULT_COUNTRY_CODE: KE
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindos_test
      DB_POOL_MIN: 1
      DB_POOL_MAX: 5
      DB_SSL: "false"
      DB_TIMEOUT_MS: 5000
      REDIS_CACHE_URL: redis://localhost:6379/0
      REDIS_QUEUE_URL: redis://localhost:6379/1
      CACHE_ENABLED: "true"
      JWT_SECRET: sprint22-test-jwt-secret-32-characters-minimum
      SESSION_SECRET: sprint22-test-session-secret-32-characters-minimum
      AUDIT_INTEGRITY_SALT: sprint22-test-audit-salt
      ALLOW_INSECURE_COOKIES: "true"
      CSRF_ENABLED: "true"
      AI_PROVIDER: mock_sandbox
      GEMINI_API_KEY: TEST_ONLY_NOT_REAL
      PAYMENTS_PROVIDER: mock
      NOTIFICATIONS_PROVIDER: mock_console
      NOTIFICATIONS_REAL_DISPATCH: "false"
      ANALYTICS_ENABLED: "false"
      STRICT_RELEASE_GATES: "true"
      SAFETY_POLICY_VERSION: 2.0.0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration registry
        run: bun run db:validate-migrations

      - name: Apply canonical migrations
        run: bun run db:migrate

      - name: Typecheck full Sprint 1-22 source
        run: bun run typecheck

      - name: Run canonical Sprint 1-22 regression
        run: bun run test

      - name: Run explicit Sprint 22 acceptance suite
        run: bun run test:sprint22

      - name: Run security secret scan
        run: bun run scan:secrets

      - name: Build production bundle
        run: bun run build
