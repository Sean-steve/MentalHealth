name: Verify Sprint 22 TypeScript syntax

on:
  push:
    branches: [main]
    paths:
      - 'mindos/care_plans/**'
      - 'mindos/clinical_tasks/**'
      - 'mindos/professional_messaging/**'
      - 'mindos/sprint22/**'
      - 'tests/canonical_care_plans_tasks_messaging_sprint22.test.ts'
      - 'server.ts'
      - 'scripts/verify_sprint22_typescript_syntax.mjs'
      - '.github/workflows/sprint22-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint22-syntax-main
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TypeScript parser
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Parse and transpile Sprint 22 TypeScript
        run: node scripts/verify_sprint22_typescript_syntax.mjs
